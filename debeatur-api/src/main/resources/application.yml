spring:
  application:
    name: debeatur-api
  datasource:
    url: ${DEBEATUR_DB_URL:jdbc:postgresql://localhost:5432/debeatur}
    username: ${DEBEATUR_DB_USUARIO:debeatur}
    password: ${DEBEATUR_DB_SENHA:debeatur}

server:
  port: 8080
  # a API só é alcançada pelo proxy do frontend; com o X-Forwarded-Proto dele, o cookie de
  # sessão sai com Secure quando o acesso é por HTTPS
  forward-headers-strategy: native
  servlet:
    session:
      # inatividade tolerada antes de pedir login de novo
      timeout: 4h
      cookie:
        http-only: true
        same-site: lax

debeatur:
  # usuário do escritório padrão, criado na subida se o escritório ainda não tem um
  usuario-inicial:
    email: ${DEBEATUR_USUARIO_EMAIL:}
    senha: ${DEBEATUR_USUARIO_SENHA:}
  series:
    # intervalo mínimo entre consultas ao SGS em busca de um mês ainda não publicado
    reconsulta: PT1H
    # meses relidos pela atualização periódica, para pegar as revisões do BCB
    meses-revisao: 24
    # cron da atualização periódica, no fuso de São Paulo ("-" desliga)
    atualizacao: "0 0 6 * * *"
