services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: debeatur
      POSTGRES_USER: debeatur
      POSTGRES_PASSWORD: ${DEBEATUR_DB_SENHA:-debeatur}
    ports:
      # só no localhost, para rodar a API fora do Docker
      - "127.0.0.1:${DEBEATUR_DB_PORTA:-5432}:5432"
    volumes:
      # a partir do Postgres 18 os dados ficam em /var/lib/postgresql/<versão>/docker
      - dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debeatur -d debeatur"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: debeatur-api/Dockerfile
    image: debeatur-api
    restart: unless-stopped
    environment:
      DEBEATUR_DB_URL: jdbc:postgresql://db:5432/debeatur
      DEBEATUR_DB_USUARIO: debeatur
      DEBEATUR_DB_SENHA: ${DEBEATUR_DB_SENHA:-debeatur}
      # usuário do escritório padrão, criado na primeira subida (ver o README)
      DEBEATUR_USUARIO_EMAIL: ${DEBEATUR_USUARIO_EMAIL:-}
      DEBEATUR_USUARIO_SENHA: ${DEBEATUR_USUARIO_SENHA:-}
      # e-mail dos convites (ver o README); sem o SMTP, só o convite deixa de funcionar
      DEBEATUR_ENDERECO: ${DEBEATUR_ENDERECO:-http://localhost:3000}
      DEBEATUR_EMAIL_REMETENTE: ${DEBEATUR_EMAIL_REMETENTE:-}
      DEBEATUR_SMTP_HOST: ${DEBEATUR_SMTP_HOST:-}
      DEBEATUR_SMTP_PORTA: ${DEBEATUR_SMTP_PORTA:-587}
      DEBEATUR_SMTP_USUARIO: ${DEBEATUR_SMTP_USUARIO:-}
      DEBEATUR_SMTP_SENHA: ${DEBEATUR_SMTP_SENHA:-}
      DEBEATUR_SMTP_AUTENTICA: ${DEBEATUR_SMTP_AUTENTICA:-true}
      DEBEATUR_SMTP_STARTTLS: ${DEBEATUR_SMTP_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: debeatur-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # Caixa de e-mail falsa para testar os convites na máquina, só com --profile email-local: o
  # SMTP fica em email:1025 para a API e a caixa em http://localhost:8025.
  email:
    image: axllent/mailpit:v1.27.11
    profiles: [email-local]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  dados:
