# Com a TLS terminada num proxy à frente deste nginx, vale o protocolo que ele informa; sem
# proxy, o deste servidor. É o que deixa os cookies da API com Secure quando o acesso é HTTPS.
map $http_x_forwarded_proto $protocolo_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocolo_original;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
